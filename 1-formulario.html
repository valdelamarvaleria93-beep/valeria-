<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         :root{--very-light-pink: #C7C7C7;
        --text-input-field: #F7F7F7;
        --hospital-green: #ACD9B2;
        --white: #FFFFFF;
        --black: #000000;
        body{
            font-family: "quicksand", sans-serif
              margin: 0;
        }
        .login{
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;}
          
        .form-container { 
            display: grid;
            grid-template-rows: auto 1fr auto;
            width:350px;
        }
        .logo{
            width: 150px;
            margin-bottom: 48px;
            justify-self: center;
            display: none;
        }
        .title{
            font-size: var(--1g);
            margin-bottom: 12px;
            text-align: center;
            
        }
        .subtitle{
            color: var(--very-light-pink);
            font-size:var(--md);
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 32px ;
            text-align: center;
        }
        .label{
            font-size:var(--md) ;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .imput{
            background-color: var(--text-input-field);
            border: none;
            border-radius:8px ;
            height: 30px;
            font-size: var(--md);
            padding: 6px;
            margin-bottom: 12px ;
        }
        .form{
            display: flex;
            flex-direction: column;
        }
        .primary-button {
            background-color: var(--hospital-green);
            border: none;
            border-radius: 8px;
            color: var(--white);
            font-size: var(--md);
            font-weight: bold;
            height: 50px;
        }
        .login-button{
             margin-top: 14px;
             margin-bottom:30px;
        }
        @media (max-width: 640){
            .logo{
                display: block;
            }
        }
    </style>

</head>
<body>
     <div class="login">
     <div class="form-container" >
    <img src="" alt="imagendenegocio" class="logo">
    <h1 class="titulo">create a new password</h1>
    <p class="subtitle">enter a new passoword for you account</p>

<form action="/" class="form"></form>
<label for="password" class="label">password</label>
<input type="password" class="input input-passw" id="password" placeholder="******************">  
<label for="new-password" class="label">re-enter password</label>
<input type="password" class="input input-passw" id="new-password" placeholder="******************">
<input type="submit" value="confirm" class="primary-button login_button" >

</body>
</html>
